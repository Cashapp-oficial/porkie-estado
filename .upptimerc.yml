# Vigila porkie.store cada 5 minutos. Si algo se cae, abre un issue
# en este repo y GitHub le manda un mail al dueño.
owner: Cashapp-oficial
repo: porkie-estado

sites:
  - name: Web
    url: https://porkie.store
  - name: Suscribirse
    url: https://porkie.store/suscribirse
  - name: App
    url: https://porkie.store/app
    expectedStatusCodes:
      - 200
      - 307

status-website:
  baseUrl: /porkie-estado
  name: Estado de Porkie
  introTitle: "**Porkie**, ¿está andando?"
  introMessage: Se revisa solo cada 5 minutos.
  navbar:
    - title: Estado
      href: /
    - title: porkie.store
      href: https://porkie.store

i18n:
  up: Funciona
  down: Caído
  degraded: Lento
  allSystemsOperational: Todo funciona
  someSystemsDegraded: Algo anda lento
  someSystemsDown: Algo está caído
